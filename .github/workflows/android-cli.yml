name: ZELKAI Android CI & Fast Error Narrowing

on:
  push:
    branches: [ "master", "main", "feat/**", "fix/**" ]
  pull_request:
    branches: [ "master", "main", "feat/**", "fix/**" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-narrow-debug:
    name: Build ZELKAI APK & Narrow Compiler Diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout ZELKAI Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Ccache for Native llama.cpp Build
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: llama-ndk-arm64-b12020
          max-size: 500M

      - name: Set up Gradle Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Vendor llama.cpp (Tag b12020) & Apply ZELKAI Overlay
        run: |
          if [ ! -f "third_party/llama.cpp/CMakeLists.txt" ]; then
            mkdir -p third_party
            git clone --depth 1 --branch b12020 https://github.com/ggml-org/llama.cpp.git third_party/llama.cpp
          fi
          cp -r scripts/llama-android-lib-overlay/* third_party/llama.cpp/examples/llama.android/lib/

      - name: Ensure Android NDK 27.2.12479018 & CMake 3.22.1
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.2.12479018" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"

      - name: Ensure Debug Keystore Exists
        run: |
          if [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: "Stage 1: Verify Firebase & Package ID Guard"
        run: |
          chmod +x ./gradlew
          ./gradlew verifyFirebaseConfig --no-daemon

      - name: "Stage 2: Compile Native :llama Runtime (ARM64 Release)"
        run: |
          set -o pipefail
          ./gradlew :llama:assembleRelease --no-daemon 2>&1 | tee native_build.log || {
            echo "### Native C++/CMake Build Errors (`:llama`)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -E "error:|fatal error:|CMake Error" native_build.log | head -n 40 >> $GITHUB_STEP_SUMMARY || tail -n 40 native_build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: "Stage 3: Fast Kotlin Compiler Check (Error Narrowing)"
        run: |
          set -o pipefail
          ./gradlew :app:compileDebugKotlin --continue --no-daemon 2>&1 | tee kotlin_compile.log || {
            echo "### Kotlin Compiler Diagnostics (`:app:compileDebugKotlin`)" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            grep -E "^e: " kotlin_compile.log >> $GITHUB_STEP_SUMMARY || tail -n 50 kotlin_compile.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }
          echo "### Kotlin Compilation" >> $GITHUB_STEP_SUMMARY
          echo "- `:app:compileDebugKotlin`: **PASSED** (0 compiler errors)" >> $GITHUB_STEP_SUMMARY

      - name: "Stage 4: Run Unit Tests"
        run: |
          ./gradlew testDebugUnitTest --continue --no-daemon || {
            echo "### Unit Test Failures" >> $GITHUB_STEP_SUMMARY
            grep -rn "<failure" app/build/test-results/testDebugUnitTest/ >> $GITHUB_STEP_SUMMARY || true
            exit 1
          }
          echo "- `testDebugUnitTest`: **PASSED**" >> $GITHUB_STEP_SUMMARY

      - name: "Stage 5: Assemble Debug APK & Verify 16 KB ELF Alignment"
        run: |
          ./gradlew assembleDebug --no-daemon
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "APK not found at $APK_PATH"
            exit 1
          fi
          ZIPALIGN_BIN=$(find $ANDROID_HOME/build-tools -name "zipalign" | sort -V | tail -n 1)
          if [ -n "$ZIPALIGN_BIN" ]; then
            "$ZIPALIGN_BIN" -c -P 16 -v 4 "$APK_PATH" | tail -n 15
          fi
          APK_SIZE=$(du -h "$APK_PATH" | cut -f1)
          echo "- **Artifact**: \`app-debug.apk\` ($APK_SIZE) — 16 KB page alignment verified" >> $GITHUB_STEP_SUMMARY

      - name: Upload Compiled ZELKAI Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: zelkai-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
